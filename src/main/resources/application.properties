# =======================================================
# LOGGING CONFIGURATION (SLF4J & Logback)
# =======================================================
# Root and package log levels
logging.level.root=INFO
logging.level.com.backend.dealspot=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# SQL logging (WARN by default; configure DEBUG/TRACE per environment)
logging.level.org.hibernate.SQL=WARN
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Console log format with color coding, MDC requestId, and userId
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%X{requestId:-NA}]){yellow} %clr([userId=%X{userId:-anonymous}]){blue} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx

# Rolling file logging configuration (logs/dealspot.log, 10MB max, 30 days retention, 1GB cap)
logging.file.name=logs/dealspot.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%X{requestId:-NA}] [userId=%X{userId:-anonymous}] [%15.15t] %-40.40logger{39} : %m%n%wEx
logging.logback.rollingpolicy.file-name-pattern=logs/dealspot-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB